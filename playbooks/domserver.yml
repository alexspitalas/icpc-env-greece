---
- name: Update apt package index
  apt:
    update_cache: yes

- name: Install required packages
  apt:
    name:
      - ca-certificates
      - curl
    state: present

- name: Create /etc/apt/keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Add Docker repository
  apt_repository:
    repo: deb [signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    state: present

- name: Update apt package index
  apt:
    update_cache: yes

- name: Install Docker packages
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      # - docker-buildx-plugin
      # - docker-compose-plugin
    state: present

- name: Ensure /etc/docker directory exists
  file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Configure Docker log rotation to prevent unbounded judgedaemon log growth
  copy:
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: '0644'
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "50m",
          "max-file": "3"
        }
      }
  notify: restart docker

- name: Ensure Docker is started and enabled at boot
  systemd:
    name: docker
    enabled: yes
    state: started

- name: Flush handlers so Docker restarts with daemon.json before pulling/running
  meta: flush_handlers

- name: Set custom judgehost Docker image parameters
  set_fact:
    judgehost_base_image: "domjudge/judgehost:9.0.0"
    judgehost_custom_image: "icpc/judgehost:9.0.0"
    judgehost_kotlin_version: "2.2.20"

- name: Pull upstream DOMjudge judgehost base image
  command: docker pull {{ judgehost_base_image }}
  register: docker_pull_result
  changed_when: "'Downloaded newer image' in docker_pull_result.stdout or 'Pull complete' in docker_pull_result.stdout"

- name: Prepare build context for custom ICPC judgehost image
  file:
    path: /tmp/icpc-judgehost-build
    state: directory
    mode: '0755'

- name: Copy custom judgehost Dockerfile into build context
  copy:
    src: files/docker/judgehost/Dockerfile
    dest: /tmp/icpc-judgehost-build/Dockerfile
    mode: '0644'

- name: Check if local Kotlin {{ judgehost_kotlin_version }} archive exists in files/
  stat:
    path: "files/kotlin-compiler-{{ judgehost_kotlin_version }}.zip"
  delegate_to: 127.0.0.1
  become: false
  register: local_judgehost_kotlin_zip

- name: Copy local Kotlin {{ judgehost_kotlin_version }} archive to VM cache
  when: local_judgehost_kotlin_zip.stat.exists
  copy:
    src: "files/kotlin-compiler-{{ judgehost_kotlin_version }}.zip"
    dest: "/tmp/kotlin-compiler-{{ judgehost_kotlin_version }}.zip"
    mode: '0644'

- name: Download Kotlin {{ judgehost_kotlin_version }} archive from GitHub Releases (when not in files/)
  when: not local_judgehost_kotlin_zip.stat.exists
  get_url:
    url: "https://github.com/JetBrains/kotlin/releases/download/v{{ judgehost_kotlin_version }}/kotlin-compiler-{{ judgehost_kotlin_version }}.zip"
    dest: "/tmp/kotlin-compiler-{{ judgehost_kotlin_version }}.zip"
    mode: '0644'
  environment:
    http_proxy: ""
    https_proxy: ""
    HTTP_PROXY: ""
    HTTPS_PROXY: ""

- name: Stage Kotlin {{ judgehost_kotlin_version }} archive in Docker build context
  copy:
    src: "/tmp/kotlin-compiler-{{ judgehost_kotlin_version }}.zip"
    dest: "/tmp/icpc-judgehost-build/kotlin-compiler-{{ judgehost_kotlin_version }}.zip"
    remote_src: yes
    mode: '0644'

- name: Build custom ICPC judgehost Docker image (GCC/G++ 14 + Kotlin {{ judgehost_kotlin_version }})
  command: >
    docker build
    --build-arg KOTLIN_VERSION={{ judgehost_kotlin_version }}
    -t {{ judgehost_custom_image }}
    /tmp/icpc-judgehost-build

- name: Clean up custom judgehost Docker build context
  file:
    path: /tmp/icpc-judgehost-build
    state: absent

- name: Prune dangling Docker image layers left from rebuilds
  command: docker image prune -f
  register: docker_prune_result
  changed_when: "'deleted:' in docker_prune_result.stdout"

- name: Smoke-test all compilers (C/C++ 14, Java 21, Python 3, PyPy 3, Kotlin {{ judgehost_kotlin_version }}) in outer container and real DOMjudge chroot
  shell: |
    docker run --rm -i --privileged \
      -e KOTLIN_VERSION="{{ judgehost_kotlin_version }}" \
      --entrypoint /bin/bash \
      "{{ judgehost_custom_image }}" <<'SMOKE_EOF'
    set -euo pipefail

    CHROOT_SCRIPT="/opt/domjudge/judgehost/lib/judge/chroot-startstop.sh"
    WORKDIR="/tmp/smoke-judging"
    OUTER_DIR="/tmp/smoke-outer"
    CHROOT_STARTED=0

    cleanup() {
      if [ "$CHROOT_STARTED" -eq 1 ]; then
        if (cd "$WORKDIR" && "$CHROOT_SCRIPT" stop); then
          rm -rf "$WORKDIR" || true
        fi
      else
        rm -rf "$WORKDIR" 2>/dev/null || true
      fi
      rm -rf "$OUTER_DIR" || true
    }
    trap cleanup EXIT

    # 1. Verify outer container toolchains (used for jury executables/validators and docker exec inspection)
    OUTER_GCC_VER="$(gcc --version | sed -n '1p')"
    OUTER_GPP_VER="$(g++ --version | sed -n '1p')"
    OUTER_JAVA_VER="$(java -version 2>&1)"
    OUTER_PY3_VER="$(python3 --version 2>&1)"
    OUTER_KOTLINC_VER="$(kotlinc -version 2>&1)"
    OUTER_KOTLIN_VER="$(kotlin -version 2>&1)"
    echo "Outer container toolchains: $OUTER_GCC_VER | $OUTER_GPP_VER | $OUTER_PY3_VER | $OUTER_KOTLINC_VER"
    [[ "$OUTER_GCC_VER" == *"14."* ]]
    [[ "$OUTER_GPP_VER" == *"14."* ]]
    [[ "$OUTER_JAVA_VER" == *"21."* ]]
    [[ -n "$OUTER_PY3_VER" ]]
    [[ "$OUTER_KOTLINC_VER" == *"${KOTLIN_VERSION}"* ]]
    [[ "$OUTER_KOTLIN_VER" == *"${KOTLIN_VERSION}"* ]]

    mkdir -p "$OUTER_DIR"
    cat <<'SRC_EOF' > "$OUTER_DIR/validator.cpp"
    #include <iostream>
    int main() { std::cout << "outer-cpp-14\n"; return 0; }
    SRC_EOF
    g++ -Wall -O2 -std=gnu++20 "$OUTER_DIR/validator.cpp" -o "$OUTER_DIR/validator"
    test "$("$OUTER_DIR/validator")" = "outer-cpp-14"

    # 2. Verify real DOMjudge per-judging chroot layout via chroot-startstop.sh
    #    (only bind-mounts etc/usr/lib/bin/lib64 + proc + dev — NO /opt and NO /tmp)
    "$CHROOT_SCRIPT" check
    mkdir -p "$WORKDIR/compile"
    chmod 0755 "$WORKDIR"
    chmod 1777 "$WORKDIR/compile"
    (cd "$WORKDIR" && "$CHROOT_SCRIPT" start)
    CHROOT_STARTED=1

    # Confirm /opt is not mounted inside the per-judging chroot (guards against /opt installs)
    test ! -e "$WORKDIR/opt"

    CHROOT_ENV=(/usr/bin/env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin HOME=/nonexistent)
    GCC_VER="$(chroot --userspec=65534:65534 "$WORKDIR" "${CHROOT_ENV[@]}" gcc --version | sed -n '1p')"
    GPP_VER="$(chroot --userspec=65534:65534 "$WORKDIR" "${CHROOT_ENV[@]}" g++ --version | sed -n '1p')"
    JAVA_VER="$(chroot --userspec=65534:65534 "$WORKDIR" "${CHROOT_ENV[@]}" java -version 2>&1)"
    PY3_VER="$(chroot --userspec=65534:65534 "$WORKDIR" "${CHROOT_ENV[@]}" python3 --version 2>&1)"
    PYPY3_VER="$(chroot --userspec=65534:65534 "$WORKDIR" "${CHROOT_ENV[@]}" pypy3 --version 2>&1)"
    KOTLINC_VER="$(chroot --userspec=65534:65534 "$WORKDIR" "${CHROOT_ENV[@]}" kotlinc -version 2>&1)"
    KOTLIN_VER="$(chroot --userspec=65534:65534 "$WORKDIR" "${CHROOT_ENV[@]}" kotlin -version 2>&1)"
    echo "Judgehost chroot toolchains: $GCC_VER | $GPP_VER | $PY3_VER | $KOTLINC_VER"
    [[ "$GCC_VER" == *"14."* ]]
    [[ "$GPP_VER" == *"14."* ]]
    [[ "$JAVA_VER" == *"21."* ]]
    [[ -n "$PY3_VER" ]]
    [[ -n "$PYPY3_VER" ]]
    [[ "$KOTLINC_VER" == *"${KOTLIN_VERSION}"* ]]
    [[ "$KOTLIN_VER" == *"${KOTLIN_VERSION}"* ]]

    cat <<'SRC_EOF' > "$WORKDIR/compile/test.c"
    #include <stdio.h>
    int main(void) { puts("hello-c-14"); return 0; }
    SRC_EOF
    cat <<'SRC_EOF' > "$WORKDIR/compile/test.cpp"
    #include <iostream>
    int main() { std::cout << "hello-cpp-14\n"; return 0; }
    SRC_EOF
    cat <<'SRC_EOF' > "$WORKDIR/compile/MainJava.java"
    public class MainJava { public static void main(String[] args) { System.out.println("hello-java-21"); } }
    SRC_EOF
    printf 'fun main() { println("hello-kotlin-%s") }\n' "${KOTLIN_VERSION}" > "$WORKDIR/compile/Main.kt"
    chmod 644 "$WORKDIR/compile/test.c" "$WORKDIR/compile/test.cpp" "$WORKDIR/compile/MainJava.java" "$WORKDIR/compile/Main.kt"

    cat <<'RUN_EOF' > "$WORKDIR/compile/run_test.sh"
    #!/bin/bash
    set -euo pipefail
    cd /compile
    gcc -x c -Wall -O2 -static -pipe -o test_c test.c -lm
    test "$(./test_c)" = "hello-c-14"
    g++ -x c++ -Wall -O2 -static -pipe -o test_cpp test.cpp
    test "$(./test_cpp)" = "hello-cpp-14"
    javac -encoding UTF-8 MainJava.java
    test "$(java -Dfile.encoding=UTF-8 -XX:+UseSerialGC -Xms64m -Xmx256m MainJava)" = "hello-java-21"
    test "$(python3 -c 'print("hello-py3")')" = "hello-py3"
    test "$(pypy3 -c 'print("hello-pypy3")')" = "hello-pypy3"
    KOTLIN_DIR="$(dirname "$(realpath "$(command -v kotlinc)")")"
    KOTLIN_STDLIB="$(dirname "$KOTLIN_DIR")/lib/kotlin-stdlib.jar"
    test -r "$KOTLIN_STDLIB"
    "${KOTLIN_DIR}/kotlinc" -d . -Djava.io.tmpdir=/ -J-Xmx384m Main.kt
    OUT=$("${KOTLIN_DIR}/kotlin" -Dfile.encoding=UTF-8 -J-XX:+UseSerialGC -J-Xss65536k -J-Xms128m -J-Xmx384m MainKt)
    test "$OUT" = "hello-kotlin-$1"
    RUN_EOF
    chmod 755 "$WORKDIR/compile/run_test.sh"

    chroot --userspec=65534:65534 "$WORKDIR" "${CHROOT_ENV[@]}" /compile/run_test.sh "${KOTLIN_VERSION}"
    SMOKE_EOF
  args:
    executable: /bin/bash
  changed_when: false

# Make directory /opt/scripts
- name: Create /opt/scripts directory
  file:
    path: /opt/scripts
    state: directory
    mode: '0755'

- name: Copy Judgehosts shell script
  copy:
    src: files/scripts/runJudgehosts.sh
    dest: /opt/scripts/runJudgehosts.sh
    mode: '0755'

- name: Copy startAllContainers shell script
  copy:
    src: files/scripts/startAllContainers.sh
    dest: /opt/scripts/startAllContainers.sh
    mode: '0755'

- name: Copy stopAllContainers shell script
  copy:
    src: files/scripts/stopAllContainers.sh
    dest: /opt/scripts/stopAllContainers.sh
    mode: '0755'

- name: Copy removeAllContainers shell script
  copy:
    src: files/scripts/removeAllContainers.sh
    dest: /opt/scripts/removeAllContainers.sh
    mode: '0755'

- name: Copy getPasswords shell script
  copy:
    src: files/scripts/getPasswords.sh
    dest: /opt/scripts/getPasswords.sh
    mode: '0755'

- name: Copy copyFilesToDesktop shell script
  copy:
    src: files/scripts/copyFilesToDesktop.sh
    dest: /opt/copyFilesToDesktop.sh
    mode: '0755'
