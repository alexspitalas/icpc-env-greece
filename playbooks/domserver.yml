---
- name: Update apt package index
  apt:
    update_cache: yes

- name: Install required packages
  apt:
    name:
      - ca-certificates
      - curl
    state: present

- name: Create /etc/apt/keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Add Docker repository
  apt_repository:
    repo: deb [signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    state: present

- name: Update apt package index
  apt:
    update_cache: yes

- name: Install Docker packages
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      # - docker-buildx-plugin
      # - docker-compose-plugin
    state: present

- name: Ensure /etc/docker directory exists
  file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Configure Docker log rotation to prevent unbounded judgedaemon log growth
  copy:
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: '0644'
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "50m",
          "max-file": "3"
        }
      }
  notify: restart docker

- name: Ensure Docker is started and enabled at boot
  systemd:
    name: docker
    enabled: yes
    state: started

- name: Flush handlers so Docker restarts with daemon.json before pulling/running
  meta: flush_handlers

- name: Pull domjudge image
  docker_image:
    name: domjudge/judgehost:9.0.0
    source: pull

# Make directory /opt/scripts
- name: Create /opt/scripts directory
  file:
    path: /opt/scripts
    state: directory
    mode: '0755'

- name: Copy Judgehosts shell script
  copy:
    src: files/scripts/runJudgehosts.sh
    dest: /opt/scripts/runJudgehosts.sh
    mode: '0755'

- name: Copy startAllContainers shell script
  copy:
    src: files/scripts/startAllContainers.sh
    dest: /opt/scripts/startAllContainers.sh
    mode: '0755'

- name: Copy stopAllContainers shell script
  copy:
    src: files/scripts/stopAllContainers.sh
    dest: /opt/scripts/stopAllContainers.sh
    mode: '0755'

- name: Copy removeAllContainers shell script
  copy:
    src: files/scripts/removeAllContainers.sh
    dest: /opt/scripts/removeAllContainers.sh
    mode: '0755'

- name: Copy getPasswords shell script
  copy:
    src: files/scripts/getPasswords.sh
    dest: /opt/scripts/getPasswords.sh
    mode: '0777'

- name: Copy copyFilesToDesktop shell script
  copy:
    src: files/scripts/copyFilesToDesktop.sh
    dest: /opt/copyFilesToDesktop.sh
    mode: '0777'
