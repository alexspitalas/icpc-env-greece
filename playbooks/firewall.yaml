- name: install UFW as the iptables frontend
  apt:
    state: present
    pkg:
      - ufw

- name: allow inbound OpenSSH in UFW (so SSH is never blocked if UFW is enabled)
  ufw:
    rule: allow
    name: OpenSSH

# Firewall is kept disabled on judgehosts so it does not interfere with Docker/DOMserver traffic.
