---
- name: Install squid
  apt:
    pkg:
      - squid-common
      - squid-openssl
    state: present

- name: Create Squid ACL from allowed_domains
  copy:
    dest: /etc/squid/acl_allowed_domains.txt
    mode: '0644'
    content: |
      # Auto-generated from group_vars/all
      {% for domain in allowed_domains %}
      .{{ domain }}
      {% endfor %}
      {% set js_host = (judge_system_url | default('') | trim | urlsplit('hostname')) | default('', true) %}
      {% if js_host %}
      {% set js_covered = namespace(found=false) %}
      {% for d in allowed_domains %}
      {% if js_host == d or js_host.endswith('.' ~ d) %}
      {% set js_covered.found = true %}
      {% endif %}
      {% endfor %}
      {% if not js_covered.found %}
      {{ js_host if (js_host is match('^([0-9]{1,3}\.){3}[0-9]{1,3}$') or (':' in js_host)) else '.' ~ js_host }}
      {% endif %}
      {% endif %}
      {% set eff_pmode = print_mode | default('auto') | lower | trim %}
      {% if eff_pmode == 'http' or (eff_pmode == 'auto' and (print_server_url | default('') | trim | length > 0)) %}
      {% set ps_raw = (print_server_url | default('') | trim) or (print_server_ip | default('') | trim) %}
      {% if ps_raw %}
      {% set ps_host = (ps_raw | urlsplit('hostname')) if '://' in ps_raw else (ps_raw.split('/')[0].split(':')[0]) %}
      {% set ps_covered = namespace(found=(ps_host == js_host or (js_host != '' and ps_host.endswith('.' ~ js_host)))) %}
      {% for d in allowed_domains %}
      {% if ps_host == d or ps_host.endswith('.' ~ d) %}
      {% set ps_covered.found = true %}
      {% endif %}
      {% endfor %}
      {% if ps_host and not ps_covered.found %}
      {{ ps_host if (ps_host is match('^([0-9]{1,3}\.){3}[0-9]{1,3}$') or (':' in ps_host)) else '.' ~ ps_host }}
      {% endif %}
      {% endif %}
      {% endif %}

  notify: restart squid

- name: configure squid
  # contains auth_token, so keep it unreadable for the contestant
  template: src=files/squid/squid.conf.j2 dest=/etc/squid/squid.conf owner=root group=proxy mode=0640
  notify: restart squid

- name: make sure an autologin.conf file exists or squid won't start
  copy: content="#placeholder\n" dest=/etc/squid/autologin.conf mode=0640 owner=root group=proxy force=no

- name: ensure systemd-resolved caching is enabled (no-cache drop-in absent)
  file:
    path: /etc/systemd/resolved.conf.d/no-cache.conf
    state: absent
  notify: restart systemd-resolved

# Prevent DNS tunneling by blocking contestant/reset accounts from querying
# systemd-resolved over local non-IP IPC (D-Bus org.freedesktop.resolve1 and the
# Varlink Unix socket /run/systemd/resolve/io.systemd.Resolve). Squid (user 'proxy')
# continues resolving allowed domains via /etc/resolv.conf (127.0.0.53:53), and
# localhost/127.0.0.1 continues resolving via /etc/hosts ('files' in nsswitch.conf).
- name: block contestant and reset accounts from systemd-resolved D-Bus API
  copy:
    dest: /etc/dbus-1/system.d/99-icpc-deny-resolve1.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      <!DOCTYPE busconfig PUBLIC
       "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
       "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
      <busconfig>
        <policy user="contestant">
          <deny send_destination="org.freedesktop.resolve1"/>
        </policy>
        <policy user="teamreset">
          <deny send_destination="org.freedesktop.resolve1"/>
        </policy>
        <policy user="fullreset">
          <deny send_destination="org.freedesktop.resolve1"/>
        </policy>
      </busconfig>
  notify: reload dbus

- name: ensure systemd-resolved drop-in directory exists
  file:
    path: /etc/systemd/system/systemd-resolved.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: restrict systemd-resolved Varlink socket to root/systemd-resolve/adm (blocks contestant DNS tunneling)
  copy:
    dest: /etc/systemd/system/systemd-resolved.service.d/99-icpc-restrict-varlink.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      [Service]
      ExecStartPost=+/bin/sh -c 'for s in /run/systemd/resolve/io.systemd.*; do if [ -S "$s" ]; then chown systemd-resolve:adm "$s" && chmod 0660 "$s"; fi; done'
  notify: restart systemd-resolved

- name: copy a pretty error page for squid to use
  template: src=files/squid/block.html.j2 dest=/usr/share/squid/errors/templates/ICPC_ERR_ACCESS_DENIED

- name: generate a fake CA for squid to use
  shell: openssl req -new -newkey rsa:2048 -days 360 -nodes -x509 -keyout /etc/squid/squidCA.pem -out /etc/squid/squidCA.crt -subj "/O=ICPC Network Filter/CN=ICPC Network Filter"
  args:
    creates: /etc/squid/squidCA.crt

- name: restrict squid CA private key permissions
  file:
    path: /etc/squid/squidCA.pem
    owner: root
    group: proxy
    mode: '0640'

- name: ensure squid CA public certificate is readable
  file:
    path: /etc/squid/squidCA.crt
    owner: root
    group: root
    mode: '0644'

- name: ensure that the squidCA is trusted by the system
  file:
    src: /etc/squid/squidCA.crt
    dest: /usr/local/share/ca-certificates/squid-ca.crt
    state: link
  notify: update-ca-certificates

- name: initialize squid ssl cache
  shell: /usr/lib/squid/security_file_certgen -c -s /var/spool/squid/ssl_db -M 4MB
  args:
    creates: /var/spool/squid/ssl_db/index.txt

- name: configure system to use the proxy by default
  lineinfile: dest=/etc/environment line="{{item}}"
  with_items:
    - http_proxy="http://localhost:3128/"
    - https_proxy="http://localhost:3128/"
    - ftp_proxy="http://localhost:3128/"
    - no_proxy="localhost,127.0.0.1"
    - HTTP_PROXY="http://localhost:3128/"
    - HTTPS_PROXY="http://localhost:3128/"
    - FTP_PROXY="http://localhost:3128/"
    - NO_PROXY="localhost,127.0.0.1"

- name: Make sure inbound policy is deny
  ufw: direction=incoming policy=deny

- name: allow inbound ssh
  ufw: rule=allow name=OpenSSH

- name: enable the firewall
  ufw: state=enabled logging=off

- name: prevent the 'contestant' user from using the network(except through the proxy or to localhost)
  lineinfile: dest=/etc/ufw/before.rules line="-I ufw-before-output -m owner --uid-owner contestant -j REJECT" insertbefore="^# don't delete the 'COMMIT' line" state=present
  notify: reload ufw

# NOTE: every '-I' rule is inserted at the TOP of the chain in file order, so this line has to be
# BEFORE the contestant line in the file, otherwise it would end up above the localhost ACCEPT below.
- name: prevent the 'teamreset' user from using the network
  lineinfile: dest=/etc/ufw/before.rules line="-I ufw-before-output -m owner --uid-owner teamreset -j REJECT" insertbefore="uid-owner contestant -j REJECT" state=present
  notify: reload ufw

- name: prevent the 'fullreset' user from using the network
  lineinfile: dest=/etc/ufw/before.rules line="-I ufw-before-output -m owner --uid-owner fullreset -j REJECT" insertbefore="uid-owner contestant -j REJECT" state=present
  notify: reload ufw

- name: Allow the contestant user(and others) to talk to localhost from localhost). Fixes issue with intellij/eclipse compilation/debugging.
  lineinfile: dest=/etc/ufw/before.rules line="-I ufw-before-output -s 127.0.0.1 -d 127.0.0.1 -j ACCEPT" insertafter="uid-owner contestant -j REJECT" state=present
  notify: reload ufw

- name: Allow contestant to reach remote CUPS print server when print_mode is cups
  when:
    - (print_mode | default('auto') | lower | trim) == 'cups'
    - print_server_ip | default('') | trim | length > 0
  lineinfile:
    dest: /etc/ufw/before.rules
    line: "-I ufw-before-output -m owner --uid-owner contestant -d {{ (print_server_ip | trim).split(':')[0] }} -p tcp --dport {{ (print_server_ip | trim).split(':')[1] if ':' in (print_server_ip | trim) else '631' }} -j ACCEPT"
    insertafter: "uid-owner contestant -j REJECT"
    state: present
  notify: reload ufw

- name: prevent the 'contestant' user from using IPv6 network(except through localhost)
  lineinfile: dest=/etc/ufw/before6.rules line="-I ufw6-before-output -m owner --uid-owner contestant -j REJECT" insertbefore="^# don't delete the 'COMMIT' line" state=present
  notify: reload ufw

- name: prevent the 'teamreset' user from using IPv6 network
  lineinfile: dest=/etc/ufw/before6.rules line="-I ufw6-before-output -m owner --uid-owner teamreset -j REJECT" insertbefore="uid-owner contestant -j REJECT" state=present
  notify: reload ufw

- name: prevent the 'fullreset' user from using IPv6 network
  lineinfile: dest=/etc/ufw/before6.rules line="-I ufw6-before-output -m owner --uid-owner fullreset -j REJECT" insertbefore="uid-owner contestant -j REJECT" state=present
  notify: reload ufw

- name: Allow localhost IPv6 traffic
  lineinfile: dest=/etc/ufw/before6.rules line="-I ufw6-before-output -s ::1 -d ::1 -j ACCEPT" insertafter="uid-owner contestant -j REJECT" state=present
  notify: reload ufw


