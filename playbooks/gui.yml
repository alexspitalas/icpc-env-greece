---
- name: install the packages necessary to make xfce run
  apt:
    state: present
    pkg:
      - xserver-xorg
      - lightdm
      - lightdm-gtk-greeter   # This keeps us from installing unity-greeter, which would pull in unity-settings and ibus(which breaks ctrl+space autocomplete in eclipse)
# suggests:
# colord cups-common gvfs liblcms2-utils librsvg2-bin lm-sensors bindfs
# desktop-base xfonts-100dpi | xfonts-75dpi xfonts-scalable xinput
# firmware-amd-graphics xserver-xorg-video-r128 xserver-xorg-video-mach64
# firmware-misc-nonfree


- name: install xfce and friends(without their recommended packages)
  apt:
    state: present
    install_recommends: false
    pkg:
      # Turns it into something resembling xubuntu(themes/etc)
      - xubuntu-default-settings
      - xfce4
      # recommends for xfce4
      - desktop-base
      - tango-icon-theme
      - thunar-volman
      # power management/terminal
      - xfce4-power-manager
      - xfce4-terminal


- name: find legacy mozillateam Launchpad PPA source files
  find:
    paths: /etc/apt/sources.list.d
    patterns: "*mozillateam*"
  register: mozillateam_ppa_files

- name: remove legacy mozillateam Launchpad PPA source files
  file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ mozillateam_ppa_files.files }}"

- name: ensure apt keyrings directory exists
  file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: download Mozilla APT repository signing key
  ansible.builtin.get_url:
    url: https://packages.mozilla.org/apt/repo-signing-key.gpg
    dest: /etc/apt/keyrings/packages.mozilla.org.asc
    owner: root
    group: root
    mode: '0644'

- name: add official Mozilla APT repository (avoids snap and Launchpad PPA outages)
  copy:
    dest: /etc/apt/sources.list.d/mozilla.sources
    owner: root
    group: root
    mode: '0644'
    content: |
      Types: deb
      URIs: https://packages.mozilla.org/apt
      Suites: mozilla
      Components: main
      Signed-By: /etc/apt/keyrings/packages.mozilla.org.asc

- name: apt preference for firefox to install from official Mozilla APT repository
  copy:
    dest: /etc/apt/preferences.d/mozilla-firefox
    owner: root
    group: root
    mode: '0644'
    content: |
      Package: *
      Pin: origin packages.mozilla.org
      Pin-Priority: 1000

- name: update apt cache after adding Mozilla repository
  apt:
    update_cache: yes

- name: install gui apps
  apt:
    state: present
    pkg:
      - firefox               # Web browser (from ppa, not snap)
      - alacarte              # Menu editor
      - mupdf                 # Lighweight pdf viewer
      - mate-calc             # GUI calculator
      - thunar-archive-plugin # Right-click "Extract Here" / "Extract To..." in Thunar & Desktop
      - xarchiver             # GUI archive manager when double-clicking .zip/.tar.gz files
      - unzip                 # ZIP extraction backend
      - zip                   # ZIP creation backend
      - p7zip-full            # 7z/zip/tar archive backend

- name: Remove unneeded packages
  apt:
    state: absent
    purge: yes
    pkg:
      - gdm3
      - gnome-shell
      - gnome-keyring
      - byobu
      - xscreensaver
      - xscreensaver-data
      - yelp
      - desktop-base
      - vlc-data

- name: setup lightdm
  copy: src=files/lightdm.conf dest=/etc/lightdm/lightdm.conf

- name: configure xorg/x11
  copy: src=files/xorg.conf dest=/etc/X11/xorg.conf

# delete some template stuff (it creates OpenDocument Text.odt, OpenDocument Sheets.ods and something else in the home directory)
- name: delete the xdg template creator autostart
  file:
    state: absent
    path: /etc/xdg/xdg-xubuntu/autostart/xdg-xubuntu-templates.desktop

- name: delete some .desktop shortcuts (so they don't show up in the applications menu)
  file:
    state: absent
    path: /usr/share/applications/{{ item }}
  with_items:
    - thunar-bulk-rename.desktop      # System->Bulk Rename
    - xfce4-mail-reader.desktop       # Mail Reader
    - thunar-volman-settings.desktop  # Removable devices and media

# Set Firefox as the system-wide and XFCE default web browser (covers xdg-open,
# Debian alternatives, XFCE Web Browser launcher, and IDE/terminal URL opens).
- name: set Firefox as system-wide default browser via update-alternatives
  alternatives:
    name: "{{ item }}"
    link: "/usr/bin/{{ item }}"
    path: /usr/bin/firefox
    priority: 200
  loop:
    - x-www-browser
    - gnome-www-browser

- name: ensure XDG and XFCE config directories exist for default browser settings
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - /etc/xdg
    - /etc/xdg/xfce4
    - /etc/skel/.config
    - /etc/skel/.config/xfce4

- name: set Firefox as default XDG MIME handler for HTTP/HTTPS/HTML
  copy:
    dest: "{{ item }}"
    owner: root
    group: root
    mode: '0644'
    content: |
      [Default Applications]
      x-scheme-handler/http=firefox.desktop
      x-scheme-handler/https=firefox.desktop
      x-scheme-handler/about=firefox.desktop
      x-scheme-handler/unknown=firefox.desktop
      text/html=firefox.desktop
      application/xhtml+xml=firefox.desktop
  loop:
    - /etc/xdg/mimeapps.list
    - /etc/skel/.config/mimeapps.list

- name: set Firefox as default XFCE preferred web browser (helpers.rc)
  copy:
    dest: "{{ item }}"
    owner: root
    group: root
    mode: '0644'
    content: |
      WebBrowser=firefox
  loop:
    - /etc/xdg/xfce4/helpers.rc
    - /etc/skel/.config/xfce4/helpers.rc

- name: check if contestant home exists for default browser config sync
  stat:
    path: /home/contestant
  register: gui_contestant_home

- name: sync default browser configs into existing contestant home
  when: gui_contestant_home.stat.exists and gui_contestant_home.stat.isdir
  block:
    - name: ensure contestant xfce4 config directory exists
      file:
        path: /home/contestant/.config/xfce4
        state: directory
        owner: contestant
        group: contestant
        mode: '0755'

    - name: copy mimeapps.list and xfce4 helpers.rc into contestant home
      copy:
        src: "/etc/skel/.config/{{ item }}"
        dest: "/home/contestant/.config/{{ item }}"
        remote_src: yes
        owner: contestant
        group: contestant
        mode: '0644'
      loop:
        - mimeapps.list
        - xfce4/helpers.rc
