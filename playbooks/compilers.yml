---
  - name: install build-essential, because it has lots of common useful packages
    apt:
      pkg: build-essential
      state: present

  - name: create a lang docs fact
    set_fact:
      lang_docs: {}

  - name: include various languages
    include_tasks: "languages/{{ language }}.yml"
    loop: "{{ languages }}"
    loop_control:
      loop_var: language

  - name: check if offline DOMjudge 9.0 manual archive exists in files/
    stat:
      path: files/domjudge-manual-9.0.tar.xz
    delegate_to: 127.0.0.1
    become: false
    register: domjudge_manual_archive

  - name: extract offline DOMjudge 9.0 manual
    when: domjudge_manual_archive.stat.exists
    unarchive:
      src: files/domjudge-manual-9.0.tar.xz
      dest: /opt
      creates: /opt/domjudge-manual-9.0/index.html
      owner: root
      group: root
      extra_opts: ['--no-same-owner']

  - name: register offline DOMjudge 9.0 manual in lang_docs
    when: domjudge_manual_archive.stat.exists
    block:
      - ansible.utils.update_fact:
          updates:
            - path: "lang_docs['DOMjudge']"
              value:
                name: DOMjudge 9.0 Manual
                id: domjudge_manual
                path: /opt/domjudge-manual-9.0
                index: index.html
        register: updated_domjudge_doc
      - set_fact:
          lang_docs: "{{ updated_domjudge_doc.lang_docs }}"

  - name: make sure web dir exists
    file: state=directory path=/opt/localwww

  - name: dump the lang_docs fact
    debug:
      var: lang_docs

  - name: create symlinks to docs
    file:
      state: link
      src: "{{item.value.path}}"
      dest: /opt/localwww/{{item.value.id}}
    loop: "{{ lang_docs | dict2items }}"

  - name: create simple index page for links to docs
    template: src=files/language-docs.html.j2 dest=/opt/localwww/index.html  
