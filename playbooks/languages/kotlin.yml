---
# ── Kotlin standalone compiler ────────────────────────────────────────────────
- name: install unzip (needed to extract kotlin)
  apt:
    pkg: unzip
    state: present

- name: Install Kotlin
  unarchive:
    src: files/kotlin-compiler-2.2.0.zip
    dest: /opt

- name: create symlinks for kotlin binaries
  file:
    src: /opt/kotlinc/bin/{{ binary_name }}
    dest: /usr/local/bin/{{ binary_name }}
    state: link
  loop_control:
    loop_var: binary_name
  with_items:
    - kapt
    - kotlin
    - kotlinc
    - kotlinc-js
    - kotlinc-jvm

# kotlin pdf doc (single file)
- name: create directory for kotlin docs
  file:
    state: directory
    mode: 0755
    path: /opt/kotlin-docs

- name: fetch kotlin pdf
  get_url:
    url: https://raw.githubusercontent.com/JetBrains/kotlin-web-site/fd7ab58c1771072241da7a24fbe7c89bb36aebc7/assets/kotlin-reference.pdf
    dest: /opt/kotlin-docs/kotlin-reference.pdf
    mode: '0644'
  environment:
    http_proxy: ""
    https_proxy: ""


- name: register docs
  block:
    - ansible.utils.update_fact:
        updates:
          - path: "lang_docs['Kotlin']"
            value:
              name: Kotlin PDF
              id: kotlin
              path: /opt/kotlin-docs
              index: kotlin-reference.pdf
      register: updated
    - set_fact:
        lang_docs: "{{ updated.lang_docs }}"

# ── Gradle installation + offline cache seeding ───────────────────────────────
# The VM has internet during build-final, so we download Gradle directly
# (same pattern as the Kotlin compiler above). Then we run a minimal dummy
# Gradle/Kotlin project ON THE VM to populate /opt/gradle-home/caches with
# the Kotlin Gradle Plugin and kotlin-stdlib. After that the cache is frozen
# and IntelliJ never needs internet again.

- name: ensure openjdk-21-jdk is present (needed to run Gradle; already installed by java.yml if java is enabled)
  apt:
    pkg: openjdk-21-jdk
    state: present

- name: Download Gradle binary distribution
  get_url:
    url: https://services.gradle.org/distributions/gradle-8.14.3-bin.zip
    dest: /tmp/gradle-8.14.3-bin.zip
    mode: '0644'
  environment:
    http_proxy: ""
    https_proxy: ""

- name: Create /opt/gradle directory
  file:
    path: /opt/gradle
    state: directory
    mode: '0755'

- name: Extract Gradle
  unarchive:
    src: /tmp/gradle-8.14.3-bin.zip
    dest: /opt/gradle
    remote_src: yes
    creates: /opt/gradle/gradle-8.14.3

- name: Create symlink for gradle binary
  file:
    src: /opt/gradle/gradle-8.14.3/bin/gradle
    dest: /usr/local/bin/gradle
    state: link

# ── Seed the Gradle cache by building a dummy Kotlin project on the VM ────────
# This runs during provisioning (internet available) and populates
# /opt/gradle-home with the Kotlin Gradle Plugin + stdlib so IntelliJ
# can work offline afterwards.

- name: Create system-wide Gradle home directory
  file:
    path: /opt/gradle-home
    state: directory
    mode: '0755'

- name: Create temporary seed project directory
  file:
    path: /tmp/gradle-seed-project/src/main/kotlin
    state: directory
    mode: '0755'

- name: Write seed project settings.gradle.kts
  copy:
    dest: /tmp/gradle-seed-project/settings.gradle.kts
    content: |
      rootProject.name = "offline-seed"

- name: Write seed project build.gradle.kts
  copy:
    dest: /tmp/gradle-seed-project/build.gradle.kts
    content: |
      plugins {
          kotlin("jvm") version "2.2.0"
      }
      repositories {
          mavenCentral()
      }
      dependencies {
          implementation(kotlin("stdlib"))
      }
      // Custom task: forces all resolvable configurations to actually download
      // their JARs into the Gradle cache without spawning a Kotlin compiler daemon.
      tasks.register("resolveDeps") {
          doLast {
              configurations
                  .filter { it.isCanBeResolved }
                  .forEach { config ->
                      try {
                          config.resolve()
                          println("[seed] resolved: ${config.name}")
                      } catch (e: Exception) {
                          logger.warn("[seed] could not resolve ${config.name}: ${e.message}")
                      }
                  }
          }
      }

- name: Write seed Kotlin source file
  copy:
    dest: /tmp/gradle-seed-project/src/main/kotlin/Main.kt
    content: |
      fun main() = println("hello")

- name: Resolve and cache all Kotlin + Gradle dependencies (no compiler daemon spawned)
  # Runs a custom 'resolveDeps' task that calls config.resolve() on all resolvable
  # configurations. This forces Gradle to download all JARs (kotlin-stdlib, KGP, etc.)
  # into /opt/gradle-home/caches WITHOUT spawning a Kotlin compiler daemon.
  # The 'dependencies' task only downloads POMs to print the tree — not the JARs.
  command: >
    /opt/gradle/gradle-8.14.3/bin/gradle
    --project-dir /tmp/gradle-seed-project
    --gradle-user-home /opt/gradle-home
    --no-daemon
    resolveDeps
  environment:
    JAVA_HOME: /usr/lib/jvm/java-21-openjdk-amd64
    PATH: /usr/lib/jvm/java-21-openjdk-amd64/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    GRADLE_OPTS: "-Xmx256m -Xms64m"
    http_proxy: ""
    https_proxy: ""
    HTTP_PROXY: ""
    HTTPS_PROXY: ""
  register: gradle_seed_result

- name: Verify kotlin-stdlib was downloaded into the Gradle cache
  shell: find /opt/gradle-home/caches -name 'kotlin-stdlib-*.jar' | grep -q .
  register: stdlib_check
  failed_when: stdlib_check.rc != 0
  changed_when: false
  # If this task fails, the seed build did not populate the cache.
  # Check gradle_seed_result output above for details.

- name: Clean up temporary seed project
  file:
    path: /tmp/gradle-seed-project
    state: absent

# ── Populate Maven Local Cache for IntelliJ Build System ──────────────────────
# When a user chooses "IntelliJ" as the build system instead of Gradle, IntelliJ
# natively attempts to download the Kotlin stdlib from Maven Central. By pre-downloading
# it into /opt/m2/repository and symlinking to ~/.m2, IntelliJ finds it instantly offline.

- name: Install Maven to fetch dependencies for IntelliJ build system
  apt:
    name: maven
    state: present
  become: yes

- name: Ensure /opt/m2/repository exists
  file:
    path: /opt/m2/repository
    state: directory
    mode: '0755'
  become: yes

- name: Pre-download Kotlin standard library for Maven Local (IntelliJ build system)
  command: >
    mvn dependency:get
    -Dartifact="org.jetbrains.kotlin:kotlin-stdlib:{{ item }}"
    -Dmaven.repo.local="/opt/m2/repository"
  loop:
    - "2.2.0"
    - "2.1.21"
    - "2.1.10"
    - "2.1.0"
    - "2.0.21"
    - "2.0.0"
    - "1.9.24"
  environment:
    http_proxy: ""
    https_proxy: ""
    HTTP_PROXY: ""
    HTTPS_PROXY: ""
  become: yes
  ignore_errors: true

- name: Pre-download Kotlin stdlib jdk8 for Maven Local (IntelliJ build system)
  command: >
    mvn dependency:get
    -Dartifact="org.jetbrains.kotlin:kotlin-stdlib-jdk8:{{ item }}"
    -Dmaven.repo.local="/opt/m2/repository"
  loop:
    - "2.2.0"
    - "2.1.21"
    - "2.1.10"
    - "2.1.0"
    - "2.0.21"
    - "2.0.0"
    - "1.9.24"
  environment:
    http_proxy: ""
    https_proxy: ""
    HTTP_PROXY: ""
    HTTPS_PROXY: ""
  become: yes
  ignore_errors: true

- name: Pre-download Kotlin reflect for Maven Local (IntelliJ build system)
  command: >
    mvn dependency:get
    -Dartifact="org.jetbrains.kotlin:kotlin-reflect:{{ item }}"
    -Dmaven.repo.local="/opt/m2/repository"
  loop:
    - "2.2.0"
    - "2.1.21"
    - "2.1.10"
    - "2.1.0"
    - "2.0.21"
    - "2.0.0"
    - "1.9.24"
  environment:
    http_proxy: ""
    https_proxy: ""
    HTTP_PROXY: ""
    HTTPS_PROXY: ""
  become: yes
  ignore_errors: true

- name: Create ~/.m2 symlink in /etc/skel for new team users
  file:
    src: /opt/m2
    dest: /etc/skel/.m2
    state: link
  become: yes

# ── Force offline mode via Gradle init script ─────────────────────────────────
# A Gradle init script in GRADLE_USER_HOME/init.d/ runs before every build.
# This is more reliable than IntelliJ XML config for enforcing offline mode.

- name: Create Gradle init.d directory
  file:
    path: /opt/gradle-home/init.d
    state: directory
    mode: '0755'

- name: Create Gradle wrapper hash directories for IntelliJ wizard bypass
