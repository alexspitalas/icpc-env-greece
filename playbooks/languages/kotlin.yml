  copy:
    dest: "/opt/gradle-home/wrapper/dists/gradle-{{ item.ver }}-{{ item.type }}/{{ item.hash }}/gradle-{{ item.ver }}-{{ item.type }}.zip.ok"
    content: ""
    force: no
