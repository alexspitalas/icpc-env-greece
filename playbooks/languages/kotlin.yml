    path: "/opt/gradle-home/wrapper/dists/gradle-{{ item.ver }}-{{ item.type }}/{{ item.hash }}"
    state: directory
    mode: '0755'
  loop:
    - { ver: '8.8', type: 'bin', hash: 'dl7vupf4psengwqhwktix4v1' }
    - { ver: '8.8', type: 'all', hash: '6gdy1pgp427xkqcjbxw3ylt6h' }
    - { ver: '8.9', type: 'bin', hash: '90cnw93cvbtalezasaz0blq0a' }
