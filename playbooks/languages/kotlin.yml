---
# ── Single unified Kotlin version (matches contestant image & icpc/judgehost:9.0.0) ──
- name: Set unified Kotlin version
  set_fact:
    kotlin_version: "2.2.20"

# ── Kotlin standalone compiler (host OS) ──────────────────────────────────────
- name: install unzip (needed to extract kotlin)
  apt:
    pkg: unzip
    state: present

- name: Check if Kotlin {{ kotlin_version }} archive is already cached on VM (from domserver.yml)
  stat:
    path: "/tmp/kotlin-compiler-{{ kotlin_version }}.zip"
  register: cached_vm_kotlin_zip

- name: Check if local Kotlin {{ kotlin_version }} archive exists in files/
  stat:
    path: "files/kotlin-compiler-{{ kotlin_version }}.zip"
  delegate_to: 127.0.0.1
  become: false
  register: local_kotlin_zip
  when: not cached_vm_kotlin_zip.stat.exists

- name: Remove any previous /opt/kotlinc before installing Kotlin {{ kotlin_version }}
  file:
    path: /opt/kotlinc
    state: absent

- name: Extract Kotlin {{ kotlin_version }} from cached VM archive
  when: cached_vm_kotlin_zip.stat.exists
  unarchive:
    src: "/tmp/kotlin-compiler-{{ kotlin_version }}.zip"
    dest: /opt
    remote_src: yes

- name: Install Kotlin {{ kotlin_version }} from local files/ archive
  when: not cached_vm_kotlin_zip.stat.exists and (local_kotlin_zip.stat.exists | default(false))
  unarchive:
    src: "files/kotlin-compiler-{{ kotlin_version }}.zip"
    dest: /opt

- name: Download and install Kotlin {{ kotlin_version }} from GitHub Releases (when not cached or in files/)
  when: not cached_vm_kotlin_zip.stat.exists and not (local_kotlin_zip.stat.exists | default(false))
  block:
    - name: Download Kotlin compiler {{ kotlin_version }}
      get_url:
        url: "https://github.com/JetBrains/kotlin/releases/download/v{{ kotlin_version }}/kotlin-compiler-{{ kotlin_version }}.zip"
        dest: "/tmp/kotlin-compiler-{{ kotlin_version }}.zip"
        mode: '0644'
      environment:
        http_proxy: ""
        https_proxy: ""
        HTTP_PROXY: ""
        HTTPS_PROXY: ""

    - name: Extract downloaded Kotlin compiler {{ kotlin_version }}
      unarchive:
        src: "/tmp/kotlin-compiler-{{ kotlin_version }}.zip"
        dest: /opt
        remote_src: yes

- name: Remove temporary Kotlin compiler archive from /tmp
  file:
    path: "/tmp/kotlin-compiler-{{ kotlin_version }}.zip"
    state: absent

- name: create symlinks for kotlin binaries
  file:
    src: /opt/kotlinc/bin/{{ binary_name }}
    dest: /usr/local/bin/{{ binary_name }}
    state: link
  loop_control:
    loop_var: binary_name
  with_items:
    - kapt
    - kotlin
    - kotlinc
    - kotlinc-js
    - kotlinc-jvm

# kotlin pdf doc (single file)
- name: create directory for kotlin docs
  file:
    state: directory
    mode: '0755'
    path: /opt/kotlin-docs

- name: fetch kotlin pdf
  get_url:
    url: https://raw.githubusercontent.com/JetBrains/kotlin-web-site/fd7ab58c1771072241da7a24fbe7c89bb36aebc7/assets/kotlin-reference.pdf
    dest: /opt/kotlin-docs/kotlin-reference.pdf
    mode: '0644'
  environment:
    http_proxy: ""
    https_proxy: ""
    HTTP_PROXY: ""
    HTTPS_PROXY: ""

- name: register docs
  block:
    - ansible.utils.update_fact:
        updates:
          - path: "lang_docs['Kotlin']"
            value:
              name: Kotlin PDF
              id: kotlin
              path: /opt/kotlin-docs
              index: kotlin-reference.pdf
      register: updated
    - set_fact:
        lang_docs: "{{ updated.lang_docs }}"

- name: Set JAVA_HOME in /etc/environment
  lineinfile:
    path: /etc/environment
    regexp: '^JAVA_HOME='
    line: 'JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64'
    create: yes
