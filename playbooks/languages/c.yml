---
# Ubuntu 24.04 (Noble) ships gcc-14 natively in the official universe repository.
# Remove any legacy Launchpad PPA source files left over from earlier builds so
# apt never depends on ppa.launchpadcontent.net.
- name: find legacy ubuntu-toolchain-r PPA source files
  find:
    paths: /etc/apt/sources.list.d
    patterns: "*ubuntu-toolchain-r*"
  register: toolchain_ppa_files

- name: remove legacy ubuntu-toolchain-r PPA source files
  file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ toolchain_ppa_files.files }}"

- name: enable universe repository
  command: add-apt-repository -y universe
  become: yes

- name: update apt cache
  apt:
    update_cache: yes

- name: c
  apt:
    state: present
    pkg:
      - gcc-14
      - gcc  # Keep default gcc for compatibility

- name: set gcc-14 as default
  alternatives:
    name: gcc
    path: /usr/bin/gcc-14
    link: /usr/bin/gcc
    priority: 100