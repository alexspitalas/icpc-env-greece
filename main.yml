---
- name: Do Everything
  hosts: vm
  become: true
  user: imageadmin
  gather_facts: true
  vars:
    ansible_python_interpreter: /usr/bin/python3
  tasks:

    - name: copy pam_environment to make sure the proxy is disabled for icpcadmin(and root)
      copy: src=files/pam_environment dest={{ item }}/.pam_environment
      with_items:
        - /root
        - /home/imageadmin

    - name: copy updated pam sudo config so it reads .pam_environment
      copy: src=files/pam_sudo dest=/etc/pam.d/sudo
    
    - name: copy Xresources
      copy:
        src: files/Xresources
        dest: /etc/skel/.Xresources

    - name: copy DocumentationHTML
      copy:
        src: files/documentHtml
        dest: /htmlfile/

    - name: ensure Xresources is merged on session start (.xsessionrc)
      copy:
        dest: /etc/skel/.xsessionrc
        content: |
          [ -f ~/.Xresources ] && xrdb -merge ~/.Xresources

    - name: ensure Xresources is merged on session start (.xprofile)
      copy:
        dest: /etc/skel/.xprofile
        content: |
          [ -f ~/.Xresources ] && xrdb -merge ~/.Xresources


    - name: disable fsync for dpkg
      copy: dest=/etc/dpkg/dpkg.cfg.d/02-dpkg-no-sync content="force-unsafe-io"
    - name: disable apt cache
      copy:
        dest: /etc/apt/apt.conf.d/02-fast-apt
        content: |
          # Disable some apt-caching
          Dir::Cache {
            srcpkgcache "";
            pkgcache "";
          }
          APT::Keep-Downloaded-Packages "false";
          Binary::apt::APT::Keep-Downloaded-Packages "false";
          # No translations
          Acquire::Language "none";

    - name: find legacy Launchpad PPA source files if present from earlier builds
      find:
        paths: /etc/apt/sources.list.d
        patterns:
          - "*ubuntu-toolchain-r*"
          - "*mozillateam*"
      register: legacy_launchpad_ppas
    - name: remove legacy Launchpad PPA source files
      file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ legacy_launchpad_ppas.files }}"

    - name: be sure apt cache is updated
      apt: update_cache=yes upgrade=dist

    - name: clean apt package archives after upgrade
      apt:
        clean: yes

    - name: set up efi booting
      apt:
        pkg: [ grub-efi, grub-efi-amd64-signed ]
        state: present
    - name: run grub-install for efi
      command: grub-install --no-nvram --uefi-secure-boot --target=x86_64-efi /dev/sda


    - name: remove snap package
      apt:
        name: snapd
        purge: true
        state: absent
    - name: clean up any leftover snap data
      file:
        state: absent
        path: "{{item}}"
      with_items:
        - /snap
        - /var/snap
        - /var/lib/snapd
        - /var/cache/snapd
        - /run/snapd-snap.socket
        - /run/snapd.socket
        - /etc/apt/apt.conf.d/20snapd.conf
    - name: prevent snapd from being installed later
      copy:
        dest: /etc/apt/preferences.d/snapd-disable
        content: |
          Package: snapd
          Pin: release *
          Pin-Priority: -1

    # remove cloud init, because it's a security issue (a cd/other usb drive could give someone root)
    - name: remove cloud-init
      apt:
        pkg: cloud-init
        state: absent
        purge: yes

    - import_tasks: 'playbooks/gui.yml'

    - import_tasks: 'playbooks/compilers.yml'   # Must run BEFORE firewall: Gradle seed needs unrestricted internet
    - import_tasks: 'playbooks/devel_tools.yml'
    - import_tasks: 'playbooks/reverseproxy.yml'
    - name: resolve and validate install_target
      set_fact:
        effective_install_target: "{{ install_target | default('usb') | lower | trim }}"
    - name: ensure install_target is valid
      assert:
        that:
          - effective_install_target in ['usb', 'ssd']
        fail_msg: "Invalid install_target '{{ install_target | default('') }}'. Expected 'usb' or 'ssd'."

    - import_tasks: 'playbooks/icpc.yml'
    - import_tasks: 'playbooks/vmtouch.yml'
    - import_tasks: 'playbooks/system.yml'
    - import_tasks: 'playbooks/wireless.yml'
    - import_tasks: 'playbooks/desktop.yml'

    - import_tasks: 'playbooks/firewall.yml'
    - import_tasks: 'playbooks/domjudge.yml'
    - import_tasks: 'playbooks/printing.yml'
    - import_tasks: 'playbooks/monitoring.yml'

    # Management related things
    #- import_tasks: 'playbooks/ansible-pull.yml'
    #- import_tasks: 'playbooks/reversetunnel.yml'

    - name: autoremove/autoclean apt
      block:
        - apt: autoremove=yes
        - apt: autoclean=yes
        - shell: apt-get clean

    - name: ensure systemd-timesyncd is running (to make sure ntp is working properly)
      # This will/should fail if ntp is installed
      service: name=systemd-timesyncd state=started

    # Copy some build information to the image
    - shell: 'echo "Built on $(date +"%Y-%m-%d %H:%M:%S")\nRevision: $(git rev-list --full-history --all --abbrev-commit | head -1)\n"'
      become: false
      register: git_revision
      delegate_to: 127.0.0.1
    - name: copy version info
      copy: content="{{git_revision.stdout}}\n" dest=/icpc/version

    # - name: zero out the disk so it's more optimal (this is part of the makeDist script)
    #   shell: |
    #     dd if=/dev/zero of=/empty bs=1M || true
    #     rm -f /empty
    #     sync

    - name: Add delete-user and full-reset aliases for admin
      lineinfile:
        path: /home/icpcadmin/.bashrc
        line: "{{ item }}"
        create: yes
        owner: icpcadmin
        group: icpcadmin
        mode: '0644'
      loop:
        - 'alias delete-user="sudo /icpc/scripts/deleteUser.sh"'
        - 'alias full-reset="sudo /icpc/scripts/full_reset.sh"'

    

  handlers:
    - name: clear user password
      command: passwd -d contestant

    - name: update grub
      shell: /usr/sbin/update-grub && chmod 0400 /boot/grub/grub.cfg

    - name: update initramfs
      command: /usr/sbin/update-initramfs -u -k all

    - name: restart squid
      service: name=squid state=restarted

    - name: restart systemd-resolved
      systemd:
        name: systemd-resolved
        state: restarted
        daemon_reload: yes

    - name: reload dbus
      systemd:
        name: dbus
        state: reloaded

    - name: update-ca-certificates
      command: /usr/sbin/update-ca-certificates

    - name: restart ssh
      service: name=ssh state=restarted

    - name: reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded

    - name: reload ufw
      command: ufw reload

    - name: restart node_exporter
      systemd:
        name: node_exporter
        state: restarted
        daemon_reload: yes

    - name: restart systemd-journald
      systemd:
        name: systemd-journald
        state: restarted

    

