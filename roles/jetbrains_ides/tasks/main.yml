---
- name: Create jetbrains-ides directory
  file:
    path: /opt/jetbrains
    state: directory
    mode: '0755'
  become: yes

# ── Extract IDEs ───────────────────────────────────────────────────────────────
- name: Extract IntelliJ Community IDEA
  unarchive:
    src: "files/ideaIC-{{ intellij_version }}.tar.gz"
    dest: /opt/jetbrains/
    creates: /opt/jetbrains/idea
  become: yes
  when: "'intellij-idea' in devtools"

- name: Extract PyCharm
  unarchive:
    src: "files/pycharm-{{ pycharm_version }}.tar.gz"
    dest: /opt/jetbrains
    creates: /opt/jetbrains/pycharm
  become: yes
  when: "'intellij-pycharm' in devtools"

- name: Extract CLion
  unarchive:
    src: "files/CLion-{{ clion_version }}.tar.gz"
    dest: /opt/jetbrains
    creates: /opt/jetbrains/clion
  become: yes
  when: "'intellij-clion' in devtools"

# ── Find installed directories ─────────────────────────────────────────────────
# Initialize safe defaults first so skipped find tasks don't leave the registered
# variables in an undefined/structurally-wrong state. Ansible finalizes task args
# (templates src/dest) before evaluating 'when', so every reference to
# X_dir.files must be safe even when that IDE is disabled.
- name: Initialize IDE directory facts with safe defaults
  set_fact:
    idea_dir: "{{ idea_dir | default({'files': []}) }}"
    pycharm_dir: "{{ pycharm_dir | default({'files': []}) }}"
    clion_dir: "{{ clion_dir | default({'files': []}) }}"

- name: Find IntelliJ IDEA directory
  find:
    paths: /opt/jetbrains
    patterns: 'ideaIC-*'
    file_type: directory
  register: idea_dir
  become: yes
  when: "'intellij-idea' in devtools"

- name: Find PyCharm directory
  find:
    paths: /opt/jetbrains
    patterns: 'pycharm-*'
    file_type: directory
  register: pycharm_dir
  become: yes
  when: "'intellij-pycharm' in devtools"

- name: Find CLion directory
  find:
    paths: /opt/jetbrains
    patterns: 'CLion-*'
    file_type: directory
  register: clion_dir
  become: yes
  when: "'intellij-clion' in devtools"

# Re-apply defaults after find tasks in case a skipped task reset the variable
# to the skipped-task dict (which lacks a 'files' key).
- name: Normalize IDE directory facts after find tasks
  set_fact:
    idea_dir: "{{ {'files': idea_dir.files} if idea_dir.files is defined else {'files': []} }}"
    pycharm_dir: "{{ {'files': pycharm_dir.files} if pycharm_dir.files is defined else {'files': []} }}"
    clion_dir: "{{ {'files': clion_dir.files} if clion_dir.files is defined else {'files': []} }}"

# ── Add IDEs to PATH ───────────────────────────────────────────────────────────
# ternary() ensures src is always a valid string during arg finalization even
# when files is empty; the 'when' guard prevents the task from actually running.
- name: Create symlink for IntelliJ IDEA binary
  file:
    src: "{{ (idea_dir.files | length > 0) | ternary(idea_dir.files | last | attr('path'), '/dev/null') }}/bin/idea.sh"
    dest: /usr/local/bin/idea
    state: link
  become: yes
  when: "'intellij-idea' in devtools and idea_dir.files | length > 0"

- name: Create symlink for PyCharm binary
  file:
    src: "{{ (pycharm_dir.files | length > 0) | ternary(pycharm_dir.files | last | attr('path'), '/dev/null') }}/bin/pycharm.sh"
    dest: /usr/local/bin/pycharm
    state: link
  become: yes
  when: "'intellij-pycharm' in devtools and pycharm_dir.files | length > 0"

- name: Create symlink for CLion binary
  file:
    src: "{{ (clion_dir.files | length > 0) | ternary(clion_dir.files | last | attr('path'), '/dev/null') }}/bin/clion.sh"
    dest: /usr/local/bin/clion
    state: link
  become: yes
  when: "'intellij-clion' in devtools and clion_dir.files | length > 0"

# ── Create desktop entries ─────────────────────────────────────────────────────
- name: Create IntelliJ IDEA desktop entry
  template:
    src: intellij-idea.desktop.j2
    dest: /usr/share/applications/intellij-idea.desktop
    mode: '0644'
  become: yes
  when: "'intellij-idea' in devtools"

- name: Create PyCharm desktop entry
  template:
    src: pycharm.desktop.j2
    dest: /usr/share/applications/pycharm.desktop
    mode: '0644'
  become: yes
  when: "'intellij-pycharm' in devtools"

- name: Create CLion desktop entry
  template:
    src: clion.desktop.j2
    dest: /usr/share/applications/clion.desktop
    mode: '0644'
  become: yes
  when: "'intellij-clion' in devtools"

# ── CLion license ──────────────────────────────────────────────────────────────
- name: Create CLion config directory
  file:
    path: "/home/contestant/.config/JetBrains/CLion2025.2"
    state: directory
    mode: '0755'
  become: yes
  when: "'intellij-clion' in devtools"

# CLion likes a weirdly formatted keyfile (UCS2 encoding with a BOM)
- name: create a script to configure clion license
  copy:
    dest: /usr/local/bin/clion-license-key-install
    mode: 0755
    content: |
      #!/bin/bash
      mkdir -p $HOME/.config/JetBrains/CLion2025.2
      (
        printf '\xFF\xFF';
        echo -en "<certificate-key>\n{{ clion_license_key }}" | iconv -f UTF-8 -t UCS2 -
      ) > $HOME/.config/JetBrains/CLion2025.2/clion.key
  when: "'intellij-clion' in devtools and clion_license_key | length > 0"

- name: add licensekey script to autostart
  copy:
    dest: /etc/xdg/autostart/clion-license-key-install.desktop
    content: |
      [Desktop Entry]
      Type=Application
      Exec=/usr/local/bin/clion-license-key-install
      NoDisplay=true
  when: "'intellij-clion' in devtools and clion_license_key | length > 0"

# ── IntelliJ Gradle offline pre-configuration ─────────────────────────────────
# Deploys gradle.xml to the IDE options directory, which tells IntelliJ to:
#   1. Use LOCAL Gradle at /opt/gradle/gradle-8.14.3 (never download via wrapper)
#   2. Use /opt/gradle-home as the Gradle user home (pre-seeded cache)
#   3. Enable Offline mode so Gradle never reaches the internet
#
# Only runs when kotlin is enabled (Gradle only exists on the image then).
# Written to contestant's config dir AND /etc/skel for newly created users.

- name: Create IntelliJ options directory for contestant
  file:
    path: "/home/contestant/.config/JetBrains/IntelliJIdea{{ intellij_version | regex_replace('(\\d+\\.\\d+)\\..*', '\\1') }}/options"
    state: directory
    mode: '0755'
  become: yes
  when: "'intellij-idea' in devtools and 'kotlin' in languages"

- name: Deploy IntelliJ Gradle settings (offline, local Gradle) for contestant
  template:
    src: gradle-settings.xml.j2
    dest: "/home/contestant/.config/JetBrains/IntelliJIdea{{ intellij_version | regex_replace('(\\d+\\.\\d+)\\..*', '\\1') }}/options/gradle.xml"
    mode: '0644'
  become: yes
  when: "'intellij-idea' in devtools and 'kotlin' in languages"

- name: Deploy IntelliJ Default Project Settings (force LOCAL Gradle) for contestant
  template:
    src: project.default.xml.j2
    dest: "/home/contestant/.config/JetBrains/IntelliJIdea{{ intellij_version | regex_replace('(\\d+\\.\\d+)\\..*', '\\1') }}/options/project.default.xml"
    mode: '0644'
  become: yes
  when: "'intellij-idea' in devtools and 'kotlin' in languages"

- name: Deploy IntelliJ Global Libraries (Kotlin runtime) for contestant
  template:
    src: applicationLibraries.xml.j2
    dest: "/home/contestant/.config/JetBrains/IntelliJIdea{{ intellij_version | regex_replace('(\\d+\\.\\d+)\\..*', '\\1') }}/options/applicationLibraries.xml"
    mode: '0644'
  become: yes
  when: "'intellij-idea' in devtools and 'kotlin' in languages"

# Also write to /etc/skel so any newly created team user inherits the settings
- name: Create IntelliJ options directory in /etc/skel
  file:
    path: "/etc/skel/.config/JetBrains/IntelliJIdea{{ intellij_version | regex_replace('(\\d+\\.\\d+)\\..*', '\\1') }}/options"
    state: directory
    mode: '0755'
  become: yes
  when: "'intellij-idea' in devtools and 'kotlin' in languages"

- name: Deploy IntelliJ Gradle settings (offline, local Gradle) to /etc/skel
  template:
    src: gradle-settings.xml.j2
    dest: "/etc/skel/.config/JetBrains/IntelliJIdea{{ intellij_version | regex_replace('(\\d+\\.\\d+)\\..*', '\\1') }}/options/gradle.xml"
    mode: '0644'
  become: yes
  when: "'intellij-idea' in devtools and 'kotlin' in languages"

- name: Deploy IntelliJ Global Libraries (Kotlin runtime) to /etc/skel
  template:
    src: applicationLibraries.xml.j2
    dest: "/etc/skel/.config/JetBrains/IntelliJIdea{{ intellij_version | regex_replace('(\\d+\\.\\d+)\\..*', '\\1') }}/options/applicationLibraries.xml"
    mode: '0644'
  become: yes
  when: "'intellij-idea' in devtools and 'kotlin' in languages"

- name: Deploy IntelliJ Default Project Settings (force LOCAL Gradle) to /etc/skel
  template:
    src: project.default.xml.j2
    dest: "/etc/skel/.config/JetBrains/IntelliJIdea{{ intellij_version | regex_replace('(\\d+\\.\\d+)\\..*', '\\1') }}/options/project.default.xml"
    mode: '0644'
  become: yes
  when: "'intellij-idea' in devtools and 'kotlin' in languages"

# ── Guarantee Gradle finds the pre-seeded cache regardless of launch method ────
# GRADLE_USER_HOME in /etc/environment is NOT reliably inherited when IntelliJ
# is launched from a desktop icon, Wayland session, or via sudo. A ~/.gradle
# symlink is the most robust solution: it makes Gradle's built-in default path
# point directly to /opt/gradle-home with no env var dependency at all.

- name: Create ~/.gradle symlink to pre-seeded cache for contestant
  file:
    src: /opt/gradle-home
    dest: /home/contestant/.gradle
    state: link
    owner: contestant
    group: contestant
  become: yes
  when: "'intellij-idea' in devtools and 'kotlin' in languages"

- name: Create ~/.gradle symlink in /etc/skel for new team users
  file:
    src: /opt/gradle-home
    dest: /etc/skel/.gradle
    state: link
  become: yes
  when: "'intellij-idea' in devtools and 'kotlin' in languages"

- name: Export GRADLE_USER_HOME in contestant shell profile (terminal launch fallback)
  lineinfile:
    path: /home/contestant/.profile
    line: 'export GRADLE_USER_HOME=/opt/gradle-home'
    regexp: '^export GRADLE_USER_HOME='
    create: yes
    owner: contestant
    group: contestant
    mode: '0644'
  become: yes
  when: "'intellij-idea' in devtools and 'kotlin' in languages"

- name: Export GRADLE_USER_HOME in /etc/skel/.profile for new team users
  lineinfile:
    path: /etc/skel/.profile
    line: 'export GRADLE_USER_HOME=/opt/gradle-home'
    regexp: '^export GRADLE_USER_HOME='
    create: yes
    mode: '0644'
  become: yes
  when: "'intellij-idea' in devtools and 'kotlin' in languages"
