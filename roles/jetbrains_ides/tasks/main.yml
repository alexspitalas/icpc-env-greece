---
- name: Create jetbrains-ides directory
  file:
    path: /opt/jetbrains
    state: directory
    mode: '0755'
  become: yes

# ── Extract IDEs ───────────────────────────────────────────────────────────────
- name: Extract IntelliJ Community IDEA
  unarchive:
    src: "files/ideaIC-{{ intellij_version }}.tar.gz"
    dest: /opt/jetbrains/
    creates: /usr/local/bin/idea
  become: yes
  when: "'intellij-idea' in devtools"

- name: Extract PyCharm
  unarchive:
    src: "files/pycharm-{{ pycharm_version }}.tar.gz"
    dest: /opt/jetbrains
    creates: /usr/local/bin/pycharm
  become: yes
  when: "'intellij-pycharm' in devtools"

- name: Extract CLion
  unarchive:
    src: "files/CLion-{{ clion_version }}.tar.gz"
    dest: /opt/jetbrains
    creates: /usr/local/bin/clion
  become: yes
  when: "'intellij-clion' in devtools"

# ── Strip bundled AI / local LLM / ML / MCP / remote-collab & high-impact unused plugins ──
# Verified across ideaIC-2025.2.4, CLion-2025.2.4, and pycharm-2025.3.6.1 tarballs:
#   - AI/LLM/ML/MCP: fullLine (offline local LLM, 272-475 MB/IDE), completionMlRanking,
#     turboComplete, aiplayground (PyCharm 92 MB), mcpserver, ml-llm/ai-assistant/llm/junie,
#     searchEverywhereMl, marketplaceMl
#   - Remote collab / sync: cwm-plugin + rider-plugins-clion-radler-cwm (CLion hard-dep on cwm),
#     settingsSync, station-plugin, remote-dev-server
#   - High-impact unused bloat: restClient, swagger, clouds-docker-impl/gateway, qodana,
#     kotlin-jupyter-plugin, jupyter-py-colab-plugin, performanceTesting-async,
#     vcs-svn/hg/perforce/github/gitlab, localization-ja/ko/zh
# Frees ~2.5 GB across IDEA + CLion + PyCharm with zero required core-IDE dependencies.
- name: Remove bundled AI, local LLM, ML, MCP, remote-collab, and high-impact unused plugins from JetBrains IDEs
  shell: |
    removed=0
    for ide_dir in /opt/jetbrains/*; do
      [ -d "$ide_dir/plugins" ] || continue
      for p in \
        fullLine completionMlRanking turboComplete aiplayground \
        cwm-plugin rider-plugins-clion-radler-cwm settingsSync \
        ml-llm ai-assistant llm junie \
        searchEverywhereMl marketplaceMl station-plugin \
        remote-dev-server clouds-docker-impl clouds-docker-gateway \
        restClient swagger qodana \
        kotlin-jupyter-plugin jupyter-py-colab-plugin performanceTesting-async \
        vcs-svn vcs-hg vcs-perforce vcs-github vcs-github-IU vcs-gitlab vcs-gitlab-IU \
        localization-ja localization-ko localization-zh; do
        if [ -e "$ide_dir/plugins/$p" ]; then
          rm -rf "$ide_dir/plugins/$p"
          removed=1
        fi
      done
      # Also catch any casing/hyphen variants of Full Line, AI Playground, MCP Server, Copilot, or Junie
      while IFS= read -r match; do
        [ -n "$match" ] || continue
        rm -rf "$match"
        removed=1
      done < <(find "$ide_dir/plugins" -maxdepth 1 -mindepth 1 \( -iname 'mcp*' -o -iname '*copilot*' -o -iname '*fullline*' -o -iname '*full-line*' -o -iname '*aiplayground*' -o -iname '*junie*' \) 2>/dev/null)
    done
    [ "$removed" -eq 1 ] && echo "removed" || true
  args:
    executable: /bin/bash
  become: yes
  register: jetbrains_ai_plugins_cleanup
  changed_when: "'removed' in (jetbrains_ai_plugins_cleanup.stdout | default(''))"

# Modern JetBrains IDEs (2025.2+) load bundled plugin descriptors from the pre-compiled
# binary index `plugins/plugin-classpath.txt` (format version 2) instead of scanning
# `plugins/*` directories on disk. If we delete plugin folders without pruning them from
# `plugin-classpath.txt`, deleted plugins (like fullLine/completionMlRanking) still appear
# in Settings -> Plugins and deleted plugins (like Qodana) register ghost extensions that
# throw ClassNotFoundException (e.g. breaking JarRepositoryManager for offline Kotlin).
- name: Prune deleted plugins from JetBrains plugins/plugin-classpath.txt binary index
  shell: |
    python3 - <<'PYEOF'
    import glob, os, struct, sys

    changed = False
    for ide_dir in sorted(glob.glob('/opt/jetbrains/*')):
        plugins_dir = os.path.join(ide_dir, 'plugins')
        cp_path = os.path.join(plugins_dir, 'plugin-classpath.txt')
        if not os.path.isfile(cp_path):
            continue
        with open(cp_path, 'rb') as fh:
            data = fh.read()
        if len(data) < 8:
            print(f"ERROR: {cp_path} too short ({len(data)} bytes)", file=sys.stderr)
            sys.exit(1)
        version, flag = data[0], data[1]
        if version != 2:
            print(f"ERROR: Unsupported plugin-classpath.txt format version {version} in {cp_path}", file=sys.stderr)
            sys.exit(1)
        pos = 2
        core_len, = struct.unpack_from('>i', data, pos); pos += 4
        core_xml = data[pos:pos + core_len]; pos += core_len
        plugin_count, = struct.unpack_from('>H', data, pos); pos += 2
        kept = []
        pruned = []
        for _ in range(plugin_count):
            start = pos
            file_count, = struct.unpack_from('>H', data, pos); pos += 2
            dir_len, = struct.unpack_from('>H', data, pos); pos += 2
            dir_name = data[pos:pos + dir_len].decode('utf-8'); pos += dir_len
            xml_len, = struct.unpack_from('>i', data, pos); pos += 4
            pos += xml_len
            for _ in range(file_count):
                f_len, = struct.unpack_from('>H', data, pos); pos += 2
                pos += f_len
            if os.path.isdir(os.path.join(plugins_dir, dir_name)):
                kept.append(data[start:pos])
            else:
                pruned.append(dir_name)
        if pos != len(data):
            print(f"ERROR: Unexpected trailing bytes in {cp_path} (pos={pos}, len={len(data)})", file=sys.stderr)
            sys.exit(1)
        if pruned:
            rebuilt = (
                bytes([version, flag])
                + struct.pack('>i', core_len)
                + core_xml
                + struct.pack('>H', len(kept))
                + b''.join(kept)
            )
            tmp_path = cp_path + '.tmp'
            with open(tmp_path, 'wb') as fh:
                fh.write(rebuilt)
            os.chmod(tmp_path, 0o644)
            os.replace(tmp_path, cp_path)
            changed = True
            print(f"pruned {len(pruned)} entries from {cp_path}: {', '.join(sorted(pruned))}")
    if changed:
        print("PRUNED_CHANGED")
    PYEOF
  args:
    executable: /bin/bash
  become: yes
  register: jetbrains_classpath_prune
  changed_when: "'PRUNED_CHANGED' in (jetbrains_classpath_prune.stdout | default(''))"

# ── Find installed directories ─────────────────────────────────────────────────
# Initialize safe defaults first so skipped find tasks don't leave the registered
# variables in an undefined/structurally-wrong state. Ansible finalizes task args
# (templates src/dest) before evaluating 'when', so every reference to
# X_dir.files must be safe even when that IDE is disabled.
- name: Initialize IDE directory facts with safe defaults
  set_fact:
    idea_dir: "{{ idea_dir | default({'files': []}) }}"
    pycharm_dir: "{{ pycharm_dir | default({'files': []}) }}"
    clion_dir: "{{ clion_dir | default({'files': []}) }}"

- name: Find IntelliJ IDEA directory
  find:
    paths: /opt/jetbrains
    patterns:
      - 'ideaIC-*'
      - 'idea-IC-*'
    file_type: directory
  register: idea_dir
  become: yes
  when: "'intellij-idea' in devtools"

- name: Find PyCharm directory
  find:
    paths: /opt/jetbrains
    patterns: 'pycharm-*'
    file_type: directory
  register: pycharm_dir
  become: yes
  when: "'intellij-pycharm' in devtools"

- name: Find CLion directory
  find:
    paths: /opt/jetbrains
    patterns:
      - 'CLion-*'
      - 'clion-*'
    file_type: directory
  register: clion_dir
  become: yes
  when: "'intellij-clion' in devtools"

# Re-apply defaults after find tasks in case a skipped task reset the variable
# to the skipped-task dict (which lacks a 'files' key).
- name: Normalize IDE directory facts after find tasks
  set_fact:
    idea_dir: "{{ {'files': idea_dir.files} if idea_dir.files is defined else {'files': []} }}"
    pycharm_dir: "{{ {'files': pycharm_dir.files} if pycharm_dir.files is defined else {'files': []} }}"
    clion_dir: "{{ {'files': clion_dir.files} if clion_dir.files is defined else {'files': []} }}"

# ── Add IDEs to PATH ───────────────────────────────────────────────────────────
# ternary() ensures src is always a valid string during arg finalization even
# when files is empty; the 'when' guard prevents the task from actually running.
- name: Create symlink for IntelliJ IDEA binary
  file:
    src: "{{ (idea_dir.files | last | default({'path': '/dev/null'})).path }}/bin/idea.sh"
    dest: /usr/local/bin/idea
    state: link
  become: yes
  when: "'intellij-idea' in devtools and idea_dir.files | length > 0"

- name: Create symlink for PyCharm binary
  file:
    src: "{{ (pycharm_dir.files | last | default({'path': '/dev/null'})).path }}/bin/pycharm.sh"
    dest: /usr/local/bin/pycharm
    state: link
  become: yes
  when: "'intellij-pycharm' in devtools and pycharm_dir.files | length > 0"

- name: Create symlink for CLion binary
  file:
    src: "{{ (clion_dir.files | last | default({'path': '/dev/null'})).path }}/bin/clion.sh"
    dest: /usr/local/bin/clion
    state: link
  become: yes
  when: "'intellij-clion' in devtools and clion_dir.files | length > 0"

# ── Create desktop entries ─────────────────────────────────────────────────────
- name: Create IntelliJ IDEA desktop entry
  template:
    src: intellij-idea.desktop.j2
    dest: /usr/share/applications/intellij-idea.desktop
    mode: '0644'
  become: yes
  when: "'intellij-idea' in devtools"

- name: Create PyCharm desktop entry
  template:
    src: pycharm.desktop.j2
    dest: /usr/share/applications/pycharm.desktop
    mode: '0644'
  become: yes
  when: "'intellij-pycharm' in devtools"

- name: Create CLion desktop entry
  template:
    src: clion.desktop.j2
    dest: /usr/share/applications/clion.desktop
    mode: '0644'
  become: yes
  when: "'intellij-clion' in devtools"

# ── CLion license (optional; CLion is installed even when clion_license_key is empty) ──
- name: Create CLion config directory
  file:
    path: "/etc/skel/.config/JetBrains/CLion2025.2"
    state: directory
    mode: '0755'
  become: yes
  when: "'intellij-clion' in devtools"

- name: Resolve whether a CLion license key was provided
  set_fact:
    clion_has_license_key: "{{ (clion_license_key | default('', true) | string | trim | length) > 0 }}"

# CLion likes a weirdly formatted keyfile (UCS2 encoding with a BOM)
- name: create a script to configure clion license
  copy:
    dest: /usr/local/bin/clion-license-key-install
    mode: '0755'
    content: |
      #!/bin/bash
      mkdir -p $HOME/.config/JetBrains/CLion2025.2
      (
        printf '\xFF\xFF';
        echo -en "<certificate-key>\n{{ clion_license_key | default('', true) | trim }}" | iconv -f UTF-8 -t UCS2 -
      ) > $HOME/.config/JetBrains/CLion2025.2/clion.key
  when: "'intellij-clion' in devtools and (clion_has_license_key | bool)"

- name: add licensekey script to autostart
  copy:
    dest: /etc/xdg/autostart/clion-license-key-install.desktop
    mode: '0644'
    content: |
      [Desktop Entry]
      Type=Application
      Exec=/usr/local/bin/clion-license-key-install
      NoDisplay=true
  when: "'intellij-clion' in devtools and (clion_has_license_key | bool)"

- name: remove stale CLion license autostart files when no license key is configured
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/bin/clion-license-key-install
    - /etc/xdg/autostart/clion-license-key-install.desktop
  when: "not ('intellij-clion' in devtools and (clion_has_license_key | bool))"

# ── IntelliJ Gradle offline pre-configuration ─────────────────────────────────
# Deploys gradle.xml to the IDE options directory, which tells IntelliJ to:
#   1. Use LOCAL Gradle at /opt/gradle/gradle-8.14.3 (never download via wrapper)
#   2. Use /opt/gradle-home as the Gradle user home (pre-seeded cache)
#   3. Enable Offline mode so Gradle never reaches the internet
#
# Only runs when kotlin is enabled (Gradle only exists on the image then).
# Written to contestant's config dir AND /etc/skel for newly created users.

# Also write to /etc/skel so any newly created team user inherits the settings
- name: Create IntelliJ options directory in /etc/skel
  file:
    path: "/etc/skel/.config/JetBrains/IdeaIC{{ intellij_version | regex_replace('(\\d+\\.\\d+)\\..*', '\\1') }}/options"
    state: directory
    mode: '0755'
  become: yes
  when: "'intellij-idea' in devtools and 'kotlin' in languages"

- name: Deploy IntelliJ Gradle settings (offline, local Gradle) to /etc/skel
  template:
    src: gradle-settings.xml.j2
    dest: "/etc/skel/.config/JetBrains/IdeaIC{{ intellij_version | regex_replace('(\\d+\\.\\d+)\\..*', '\\1') }}/options/gradle.xml"
    mode: '0644'
  become: yes
  when: "'intellij-idea' in devtools and 'kotlin' in languages"

- name: Deploy IntelliJ Global Libraries (Kotlin runtime) to /etc/skel
  template:
    src: applicationLibraries.xml.j2
    dest: "/etc/skel/.config/JetBrains/IdeaIC{{ intellij_version | regex_replace('(\\d+\\.\\d+)\\..*', '\\1') }}/options/applicationLibraries.xml"
    mode: '0644'
  become: yes
  when: "'intellij-idea' in devtools and 'kotlin' in languages"

- name: Deploy IntelliJ Maven settings (force offline mode) to /etc/skel
  template:
    src: maven.xml.j2
    dest: "/etc/skel/.config/JetBrains/IdeaIC{{ intellij_version | regex_replace('(\\d+\\.\\d+)\\..*', '\\1') }}/options/maven.xml"
    mode: '0644'
  become: yes
  when: "'intellij-idea' in devtools and 'kotlin' in languages"

- name: Deploy IntelliJ JDK Table (pre-configures JDK to fix Kotlin auto-configure prompt) to /etc/skel
  copy:
    src: files/jdk.table.xml
    dest: "/etc/skel/.config/JetBrains/IdeaIC{{ intellij_version | regex_replace('(\\d+\\.\\d+)\\..*', '\\1') }}/options/jdk.table.xml"
    mode: '0644'
  become: yes
  when: "'intellij-idea' in devtools and 'kotlin' in languages"

- name: Deploy IntelliJ Default Project Settings (force LOCAL Gradle) to /etc/skel
  template:
    src: project.default.xml.j2
    dest: "/etc/skel/.config/JetBrains/IdeaIC{{ intellij_version | regex_replace('(\\d+\\.\\d+)\\..*', '\\1') }}/options/project.default.xml"
    mode: '0644'
  become: yes
  when: "'intellij-idea' in devtools and 'kotlin' in languages"
